<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оберіть місце на карті</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
        }
        
        /* Центральний маркер */
        .center-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1001;
            pointer-events: none;
            transform: translate(-50%, -100%);
            font-size: 48px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        
        /* Пошук внизу */
        .search-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #FFD700;
            border-radius: 16px;
            font-size: 16px;
            background: rgba(26, 26, 26, 0.98);
            color: #FFD700;
        }
        
        /* Автокомпліт */
        .autocomplete-results {
            position: fixed;
            bottom: 90px;
            left: 20px;
            right: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(26, 26, 26, 0.98);
            border: 2px solid #FFD700;
            border-radius: 16px;
            z-index: 999;
            display: none;
        }
        
        .autocomplete-item {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            cursor: pointer;
            color: #FFD700;
            font-size: 14px;
        }
        
        .autocomplete-item:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        
        .confirm-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
        }
        
        .location-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        
        /* Панель обраних адрес */
        .selected-addresses {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(26, 26, 26, 0.95);
            border: 2px solid #FFD700;
            border-radius: 16px;
            padding: 12px;
            z-index: 1000;
            display: none;
        }
        
        .address-line {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }
        
        .address-line:last-child {
            margin-bottom: 0;
        }
        
        .address-label {
            font-size: 14px;
            font-weight: 600;
            color: #FFD700;
            white-space: nowrap;
        }
        
        .address-value {
            flex: 1;
            font-size: 13px;
            color: #FFF;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .edit-address-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #FFD700;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .edit-address-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(26, 26, 26, 0.98);
            color: #FFD700;
            padding: 30px;
            border-radius: 20px;
            display: none;
            border: 2px solid #FFD700;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="center-marker" id="center-marker">📍</div>
    
    <div class="selected-addresses" id="selected-addresses">
        <div class="address-line" id="pickup-address-line">
            <span class="address-label">📍</span>
            <span class="address-value" id="pickup-address-text">Не обрано</span>
            <button class="edit-address-btn" id="edit-pickup-btn">⚙️</button>
        </div>
        <div class="address-line" id="dest-address-line" style="display: none;">
            <span class="address-label">🏁</span>
            <span class="address-value" id="dest-address-text">Не обрано</span>
            <button class="edit-address-btn" id="edit-dest-btn">⚙️</button>
        </div>
    </div>
    
    <div class="autocomplete-results" id="autocomplete-results"></div>
    
    <button class="location-btn" id="location-btn">📍</button>
    
    <div class="search-container">
        <input type="text" class="search-input" id="search" placeholder="📍 Звідки їдемо?" autocomplete="off">
        <button class="confirm-btn" id="confirm">✅</button>
    </div>
    
    <div class="loading" id="loading">
        <div>Завантаження...</div>
    </div>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Стан
        let currentState = 'pickup';  // pickup → destination → confirm
        let pickupCoords = null;
        let destinationCoords = null;
        let pickupMarker = null;
        let destinationMarker = null;
        let routeLine = null;
        
        // Ініціалізація карти
        const map = L.map('map').setView([50.4501, 30.5234], 13); // За замовчуванням Київ
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        // Центрувати на місто користувача
        (async () => {
            try {
                const userId = tg.initDataUnsafe?.user?.id;
                if (userId) {
                    const response = await fetch('/api/webapp/get-user-city', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success && data.coordinates) {
                            map.setView([data.coordinates.lat, data.coordinates.lon], 13);
                        }
                    }
                }
            } catch (e) {
                // Помилка - залишаємо Київ
            }
        })();
        
        // Функція створення маркера
        function createMarker(isPickup) {
            const emoji = isPickup ? '📍' : '🏁';
            return L.divIcon({
                html: `<div style="font-size: 48px;">${emoji}</div>`,
                iconSize: [48, 48],
                iconAnchor: [24, 46]
            });
        }
        
        // Функція побудови маршруту
        async function buildRoute(fromLat, fromLon, toLat, toLon) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    
                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }
                    
                    routeLine = L.polyline(coords, {
                        color: '#2196F3',
                        weight: 6
                    }).addTo(map);
                    
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                }
            } catch (e) {
                alert('Помилка побудови маршруту');
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // Оновлення панелі адрес
        let lastNominatimCall = 0;
        async function updateAddressPanel(type, lat, lng) {
            try {
                // Rate limiting для Nominatim (1 запит в секунду)
                const now = Date.now();
                const timeSinceLastCall = now - lastNominatimCall;
                if (timeSinceLastCall < 1000) {
                    await new Promise(resolve => setTimeout(resolve, 1000 - timeSinceLastCall));
                }
                lastNominatimCall = Date.now();
                
                // Використовуємо Nominatim для reverse geocoding
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
                    {
                        headers: {
                            'User-Agent': 'TaxiBot WebApp/1.0'
                        }
                    }
                );
                const data = await response.json();
                
                let address = 'Завантаження...';
                if (data && data.display_name) {
                    // Коротка адреса: вулиця + будинок
                    const parts = data.display_name.split(',');
                    address = parts.slice(0, 2).join(',').trim();
                }
                
                if (type === 'pickup') {
                    document.getElementById('pickup-address-text').textContent = address;
                    document.getElementById('selected-addresses').style.display = 'block';
                } else if (type === 'destination') {
                    document.getElementById('dest-address-text').textContent = address;
                    document.getElementById('dest-address-line').style.display = 'flex';
                }
            } catch (e) {
                console.error('Помилка отримання адреси:', e);
                // Fallback на координати
                const fallbackAddress = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                if (type === 'pickup') {
                    document.getElementById('pickup-address-text').textContent = fallbackAddress;
                } else {
                    document.getElementById('dest-address-text').textContent = fallbackAddress;
                }
            }
        }
        
        // Кнопка підтвердження
        document.getElementById('confirm').addEventListener('click', async () => {
            const center = map.getCenter();
            
            if (currentState === 'pickup') {
                // Зберігаємо pickup
                pickupCoords = { lat: center.lat, lng: center.lng };
                
                if (pickupMarker) {
                    map.removeLayer(pickupMarker);
                }
                
                pickupMarker = L.marker([center.lat, center.lng], {
                    icon: createMarker(true)
                }).addTo(map);
                
                // Оновити панель
                updateAddressPanel('pickup', center.lat, center.lng);
                
                // Переходимо до destination
                currentState = 'destination';
                document.getElementById('center-marker').textContent = '🏁';
                document.getElementById('search').placeholder = '🎯 Куди їдемо?';
                
            } else if (currentState === 'destination') {
                // Зберігаємо destination
                destinationCoords = { lat: center.lat, lng: center.lng };
                
                if (destinationMarker) {
                    map.removeLayer(destinationMarker);
                }
                
                destinationMarker = L.marker([center.lat, center.lng], {
                    icon: createMarker(false)
                }).addTo(map);
                
                // Оновити панель
                updateAddressPanel('destination', center.lat, center.lng);
                
                // Будуємо маршрут
                await buildRoute(
                    pickupCoords.lat, pickupCoords.lng,
                    destinationCoords.lat, destinationCoords.lng
                );
                
                // Переходимо до confirm
                currentState = 'confirm';
                document.getElementById('center-marker').style.display = 'none';
                document.getElementById('search').placeholder = '✅ Підтвердити замовлення';
                
            } else if (currentState === 'confirm') {
                // Відправляємо дані
                const userId = tg.initDataUnsafe?.user?.id;
                
                if (!userId) {
                    alert('Помилка: не вдалося отримати ID користувача');
                    return;
                }
                
                try {
                    const response = await fetch('/api/webapp/order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: userId,
                            pickup_lat: pickupCoords.lat,
                            pickup_lon: pickupCoords.lng,
                            dest_lat: destinationCoords.lat,
                            dest_lon: destinationCoords.lng
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                        setTimeout(() => tg.close(), 500);
                    } else {
                        alert('Помилка: ' + result.error);
                    }
                } catch (e) {
                    alert('Помилка відправки: ' + e.message);
                }
            }
        });
        
        // Пошук адрес
        const searchInput = document.getElementById('search');
        const autocompleteResults = document.getElementById('autocomplete-results');
        let searchTimeout;
        
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 3) {
                autocompleteResults.style.display = 'none';
                autocompleteResults.innerHTML = '';
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`/api/webapp/geocode?q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    if (data.length === 0) {
                        autocompleteResults.innerHTML = '<div class="autocomplete-item">🔍 Нічого не знайдено</div>';
                        autocompleteResults.style.display = 'block';
                        return;
                    }
                    
                    autocompleteResults.innerHTML = '';
                    data.slice(0, 5).forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.textContent = item.display_name;
                        div.addEventListener('click', () => {
                            map.setView([item.lat, item.lon], 16);
                            searchInput.value = item.display_name;
                            autocompleteResults.style.display = 'none';
                        });
                        autocompleteResults.appendChild(div);
                    });
                    
                    autocompleteResults.style.display = 'block';
                } catch (e) {
                    console.error('Помилка пошуку:', e);
                }
            }, 500);
        });
        
        // Закрити autocomplete при кліку поза ним
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !autocompleteResults.contains(e.target)) {
                autocompleteResults.style.display = 'none';
            }
        });
        
        // Кнопка геолокації
        document.getElementById('location-btn').addEventListener('click', () => {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        map.setView([lat, lon], 16);
                        loading.style.display = 'none';
                        
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                    },
                    (error) => {
                        loading.style.display = 'none';
                        alert('❌ Не вдалося отримати геолокацію');
                        console.error('Geolocation error:', error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                loading.style.display = 'none';
                alert('❌ Геолокація не підтримується');
            }
        });
        
        // Закриття WebApp
        tg.BackButton.show();
        tg.onEvent('backButtonClicked', () => {
            tg.close();
        });
    </script>
</body>
</html>
