<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оберіть місце на карті</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
        }
        
        /* Центральний маркер */
        .center-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1001;
            pointer-events: none;
            transform: translate(-50%, -100%);
            font-size: 48px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        
        /* Пошук внизу */
        .search-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            padding: 14px;
            border: 2px solid #FFD700;
            border-radius: 16px;
            font-size: 16px;
            background: rgba(26, 26, 26, 0.98);
            color: #FFD700;
        }
        
        .confirm-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: rgba(26, 26, 26, 0.98);
            color: #FFD700;
            padding: 30px;
            border-radius: 20px;
            display: none;
            border: 2px solid #FFD700;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="center-marker" id="center-marker">📍</div>
    
    <div class="search-container">
        <input type="text" class="search-input" id="search" placeholder="📍 Звідки їдемо?" autocomplete="off">
        <button class="confirm-btn" id="confirm">✅</button>
    </div>
    
    <div class="loading" id="loading">
        <div>Завантаження...</div>
    </div>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Стан
        let currentState = 'pickup';  // pickup → destination → confirm
        let pickupCoords = null;
        let destinationCoords = null;
        let pickupMarker = null;
        let destinationMarker = null;
        let routeLine = null;
        
        // Ініціалізація карти
        const map = L.map('map').setView([50.4501, 30.5234], 13); // За замовчуванням Київ
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        // Центрувати на місто користувача
        (async () => {
            try {
                const userId = tg.initDataUnsafe?.user?.id;
                if (userId) {
                    const response = await fetch('/api/webapp/get-user-city', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId })
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success && data.coordinates) {
                            map.setView([data.coordinates.lat, data.coordinates.lon], 13);
                        }
                    }
                }
            } catch (e) {
                // Помилка - залишаємо Київ
            }
        })();
        
        // Функція створення маркера
        function createMarker(isPickup) {
            const emoji = isPickup ? '📍' : '🏁';
            return L.divIcon({
                html: `<div style="font-size: 48px;">${emoji}</div>`,
                iconSize: [48, 48],
                iconAnchor: [24, 46]
            });
        }
        
        // Функція побудови маршруту
        async function buildRoute(fromLat, fromLon, toLat, toLon) {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    
                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }
                    
                    routeLine = L.polyline(coords, {
                        color: '#2196F3',
                        weight: 6
                    }).addTo(map);
                    
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                }
            } catch (e) {
                alert('Помилка побудови маршруту');
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // Кнопка підтвердження
        document.getElementById('confirm').addEventListener('click', async () => {
            const center = map.getCenter();
            
            if (currentState === 'pickup') {
                // Зберігаємо pickup
                pickupCoords = { lat: center.lat, lng: center.lng };
                
                if (pickupMarker) {
                    map.removeLayer(pickupMarker);
                }
                
                pickupMarker = L.marker([center.lat, center.lng], {
                    icon: createMarker(true)
                }).addTo(map);
                
                // Переходимо до destination
                currentState = 'destination';
                document.getElementById('center-marker').textContent = '🏁';
                document.getElementById('search').placeholder = '🎯 Куди їдемо?';
                
            } else if (currentState === 'destination') {
                // Зберігаємо destination
                destinationCoords = { lat: center.lat, lng: center.lng };
                
                if (destinationMarker) {
                    map.removeLayer(destinationMarker);
                }
                
                destinationMarker = L.marker([center.lat, center.lng], {
                    icon: createMarker(false)
                }).addTo(map);
                
                // Будуємо маршрут
                await buildRoute(
                    pickupCoords.lat, pickupCoords.lng,
                    destinationCoords.lat, destinationCoords.lng
                );
                
                // Переходимо до confirm
                currentState = 'confirm';
                document.getElementById('center-marker').style.display = 'none';
                document.getElementById('search').placeholder = '✅ Підтвердити замовлення';
                
            } else if (currentState === 'confirm') {
                // Відправляємо дані
                const userId = tg.initDataUnsafe?.user?.id;
                
                if (!userId) {
                    alert('Помилка: не вдалося отримати ID користувача');
                    return;
                }
                
                try {
                    const response = await fetch('/api/webapp/order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: userId,
                            pickup_lat: pickupCoords.lat,
                            pickup_lon: pickupCoords.lng,
                            dest_lat: destinationCoords.lat,
                            dest_lon: destinationCoords.lng
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                        setTimeout(() => tg.close(), 500);
                    } else {
                        alert('Помилка: ' + result.error);
                    }
                } catch (e) {
                    alert('Помилка відправки: ' + e.message);
                }
            }
        });
        
        // Закриття WebApp
        tg.BackButton.show();
        tg.onEvent('backButtonClicked', () => {
            tg.close();
        });
    </script>
</body>
</html>
