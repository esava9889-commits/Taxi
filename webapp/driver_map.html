<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Керування поїздкою</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
        }
        
        /* Центральний маркер - ВИДАЛЕНО для водія */
        
        /* Виправлення для маркерів Leaflet - прибрати квадратну обводку */
        .leaflet-marker-icon {
            background: transparent !important;
            border: none !important;
        }
        
        /* Кнопка керування поїздкою внизу */
        .driver-control-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 18px 40px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 280px;
            text-align: center;
        }
        
        .driver-control-btn:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 215, 0, 0.6);
        }
        
        .driver-control-btn:active {
            transform: translateX(-50%) translateY(0);
        }
        
        .driver-control-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .search-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .search-input {
            flex: 1;
            padding: 14px 50px 14px 14px;
            border: 2px solid #FFD700;
            border-radius: 16px;
            font-size: 16px;
            background: rgba(26, 26, 26, 0.98);
            color: #FFD700;
            width: 100%;
        }
        
        .search-input::placeholder {
            color: rgba(255, 215, 0, 0.6);
        }
        
        .search-btn {
            position: absolute;
            right: 8px;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
            transition: all 0.2s ease;
        }
        
        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.6);
        }
        
        .search-btn:active {
            transform: scale(0.95);
        }
        
        /* Автокомпліт */
        .autocomplete-results {
            position: fixed;
            bottom: 90px;
            left: 20px;
            right: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(26, 26, 26, 0.98);
            border: 2px solid #FFD700;
            border-radius: 16px;
            z-index: 999;
            display: none;
        }
        
        .autocomplete-item {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            cursor: pointer;
            color: #FFD700;
            font-size: 14px;
        }
        
        .autocomplete-item:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        .autocomplete-item:last-child {
            border-bottom: none;
        }
        
        .confirm-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border: none;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
        }
        
        .location-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        
        /* Панель обраних адрес */
        .selected-addresses {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(26, 26, 26, 0.95);
            border: 2px solid #FFD700;
            border-radius: 16px;
            padding: 12px;
            z-index: 1000;
            display: none;
        }
        
        .address-line {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }
        
        .address-line:last-child {
            margin-bottom: 0;
        }
        
        .address-label {
            font-size: 14px;
            font-weight: 600;
            color: #FFD700;
            white-space: nowrap;
        }
        
        .address-value {
            flex: 1;
            font-size: 13px;
            color: #FFF;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .edit-address-btn {
            width: 32px;
            height: 32px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #FFD700;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .edit-address-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        
        /* Інфо про маршрут - ЧОРНО-ЗОЛОТИЙ */
        .route-info {
            position: fixed;
            bottom: 80px;
            left: 10px;
            right: 10px;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.98), rgba(45, 45, 45, 0.98));
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.3);
            z-index: 1000;
            font-size: 14px;
            color: rgba(255, 215, 0, 0.9);
            display: none;
            border: 2px solid #FFD700;
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s ease-out;
        }
        
        .route-info strong {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 🚗 КАСТОМНИЙ LOADER "URBAN" - ТЕМНИЙ З ЖОВТИМ */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.98), rgba(45, 45, 45, 0.98));
            color: #FFD700;
            padding: 30px 40px;
            border-radius: 20px;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 50px rgba(255, 215, 0, 0.4);
            text-align: center;
            border: 2px solid #FFD700;
            backdrop-filter: blur(10px);
        }
        
        /* Typing text для "Urban" - ЖОВТИЙ */
        .loading-text {
            font-size: 32px;
            font-weight: bold;
            color: #FFD700;
            font-family: 'Segoe UI', Roboto, sans-serif;
            letter-spacing: 2px;
            margin-bottom: 20px;
            overflow: hidden;
            border-right: 3px solid #FFD700;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: typing 1.5s steps(5) forwards, blinkCursor 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blinkCursor {
            from, to { border-color: transparent; }
            50% { border-color: #FFD700; }
        }
        
        /* 🚗 Колесо що крутиться - ЖОВТЕ */
        .loading-wheel {
            width: 60px;
            height: 60px;
            margin: 0 auto;
            position: relative;
        }
        
        .wheel {
            width: 60px;
            height: 60px;
            border: 6px solid #3a3a3a;
            border-top: 6px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 🎬 SPLASH SCREEN - Заставка при завантаженні */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fadeOut 1s ease-out 4s forwards;
        }
        
        /* SVG контейнер для силуету міста */
        .city-silhouette {
            width: 90%;
            max-width: 500px;
            height: auto;
        }
        
        /* Золотиста лінія що малює силует */
        .city-path {
            fill: none;
            stroke: #FFD700;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawCitySilhouette 2.5s ease-out forwards;
        }
        
        /* Анімація малювання силуету міста */
        @keyframes drawCitySilhouette {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        /* Вікна у будівлях */
        .city-window {
            fill: #FFD700;
            opacity: 0;
            animation: windowAppear 0.3s ease-out forwards, windowBlink 2s ease-in-out infinite;
        }
        
        /* Поява вікон після силуету (з різною затримкою) */
        .city-window:nth-child(1) { animation-delay: 2.5s, 2.8s; }
        .city-window:nth-child(2) { animation-delay: 2.6s, 2.9s; }
        .city-window:nth-child(3) { animation-delay: 2.7s, 3.0s; }
        .city-window:nth-child(4) { animation-delay: 2.5s, 3.1s; }
        .city-window:nth-child(5) { animation-delay: 2.6s, 2.8s; }
        .city-window:nth-child(6) { animation-delay: 2.7s, 2.9s; }
        .city-window:nth-child(7) { animation-delay: 2.5s, 3.0s; }
        .city-window:nth-child(8) { animation-delay: 2.6s, 3.1s; }
        .city-window:nth-child(9) { animation-delay: 2.7s, 2.8s; }
        .city-window:nth-child(10) { animation-delay: 2.5s, 2.9s; }
        .city-window:nth-child(11) { animation-delay: 2.6s, 3.0s; }
        .city-window:nth-child(12) { animation-delay: 2.7s, 3.1s; }
        
        @keyframes windowAppear {
            to {
                opacity: 1;
            }
        }
        
        @keyframes windowBlink {
            0%, 100% {
                opacity: 1;
                filter: brightness(1);
            }
            50% {
                opacity: 0.4;
                filter: brightness(0.6);
            }
        }
        
        /* Надпис Urban під містом */
        .splash-title {
            font-size: 52px;
            font-weight: bold;
            color: #FFD700;
            font-family: 'Segoe UI', Roboto, sans-serif;
            letter-spacing: 8px;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            opacity: 0;
            animation: fadeInTitle 1s ease-out 2.8s forwards;
        }
        
        @keyframes fadeInTitle {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 🚕 Анімація таксі */
        .taxi-group {
            animation: taxiDrive 2.5s ease-in-out forwards;
        }
        
        @keyframes taxiDrive {
            0% {
                transform: translateX(450px);
            }
            48% {
                transform: translateX(200px);
            }
            58% {
                transform: translateX(200px);
            }
            100% {
                transform: translateX(-100px);
            }
        }
        
        /* Дим з-під коліс */
        .smoke {
            fill: rgba(255, 215, 0, 0.3);
            animation: smokeMove 0.8s ease-out infinite;
        }
        
        @keyframes smokeMove {
            0% {
                opacity: 0.3;
                transform: scale(0.5) translateX(0);
            }
            100% {
                opacity: 0;
                transform: scale(1.5) translateX(-15px);
            }
        }
        
        /* Пасажир (людина) */
        .passenger {
            fill: none;
            stroke: #FFD700;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
            animation: passengerDisappear 0.3s ease-out 1.5s forwards;
        }
        
        @keyframes passengerDisappear {
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }
        
        /* Назва міста - сховано, буде показано на карті */
        .splash-city {
            display: none;
        }
        
        /* Колесо що котиться */
        .splash-wheel-container {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 80px;
            overflow: hidden;
        }
        
        .splash-wheel {
            width: 80px;
            height: 80px;
            border: 8px solid #3a3a3a;
            border-top: 8px solid #FFD700;
            border-radius: 50%;
            position: absolute;
            left: -100px;
            animation: wheelRoll 3s ease-in-out forwards;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        
        .splash-wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            background: #FFD700;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }
        
        /* Анімація ковзання колеса зліва направо з обертанням */
        @keyframes wheelRoll {
            0% {
                left: -100px;
                transform: rotate(0deg);
            }
            100% {
                left: calc(100% + 100px);
                transform: rotate(1080deg); /* 3 повних оберти */
            }
        }
        
        /* typing та blinkCursor вже визначені для .loading-text вище */
        
        /* Анімація появи назви міста */
        @keyframes cityFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Анімація зникнення splash screen */
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
        
        /* Сховати splash після анімації */
        .splash-screen.hidden {
            display: none;
        }
        
        /* Анімація поступового прокладання маршруту */
        @keyframes drawRoute {
            from {
                stroke-dashoffset: var(--route-length);
            }
            to {
                stroke-dashoffset: 0;
            }
        }
        
        .animated-route {
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
            z-index: 400 !important;
        }
        
        /* Leaflet path - забезпечити що маршрут завжди суцільний */
        .leaflet-overlay-pane svg {
            pointer-events: none;
        }
        
        .leaflet-overlay-pane path {
            pointer-events: visiblePainted;
        }
    </style>
</head>
<body>
    <!-- 🎬 SPLASH SCREEN -->
    <div class="splash-screen" id="splash-screen">
        <!-- SVG силует міста що малюється золотистою лінією -->
        <svg class="city-silhouette" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Лінія що малює силует міста (зліва направо, знизу вгору) -->
            <path class="city-path" d="
                M 20 180
                L 20 140
                L 40 140
                L 40 100
                L 70 100
                L 70 120
                L 90 120
                L 90 80
                L 120 80
                L 120 110
                L 140 110
                L 140 70
                L 170 70
                L 170 100
                L 190 100
                L 190 60
                L 220 60
                L 220 90
                L 240 90
                L 240 50
                L 270 50
                L 270 80
                L 290 80
                L 290 110
                L 310 110
                L 310 90
                L 330 90
                L 330 120
                L 350 120
                L 350 100
                L 370 100
                L 370 140
                L 380 140
                L 380 180
                Z
            "/>
            
            <!-- Вікна у будівлях (з'являються після малювання силуету) -->
            <g class="windows">
                <rect class="city-window" x="25" y="145" width="8" height="8" />
                <rect class="city-window" x="25" y="160" width="8" height="8" />
                <rect class="city-window" x="45" y="105" width="8" height="8" />
                <rect class="city-window" x="45" y="120" width="8" height="8" />
                <rect class="city-window" x="95" y="85" width="8" height="8" />
                <rect class="city-window" x="95" y="100" width="8" height="8" />
                <rect class="city-window" x="145" y="75" width="8" height="8" />
                <rect class="city-window" x="145" y="90" width="8" height="8" />
                <rect class="city-window" x="195" y="65" width="8" height="8" />
                <rect class="city-window" x="195" y="80" width="8" height="8" />
                <rect class="city-window" x="245" y="55" width="8" height="8" />
                <rect class="city-window" x="245" y="70" width="8" height="8" />
                <rect class="city-window" x="295" y="115" width="8" height="8" />
                <rect class="city-window" x="295" y="130" width="8" height="8" />
                <rect class="city-window" x="335" y="95" width="8" height="8" />
                <rect class="city-window" x="335" y="110" width="8" height="8" />
            </g>
            
            <!-- 👤 Пасажир (стоїть по центру, зникає коли таксі зупиняється) -->
            <g class="passenger">
                <!-- Голова -->
                <circle cx="200" cy="150" r="4" />
                <!-- Тіло -->
                <line x1="200" y1="154" x2="200" y2="165" />
                <!-- Руки -->
                <line x1="200" y1="157" x2="195" y2="162" />
                <line x1="200" y1="157" x2="205" y2="162" />
                <!-- Ноги -->
                <line x1="200" y1="165" x2="197" y2="173" />
                <line x1="200" y1="165" x2="203" y2="173" />
            </g>
            
            <!-- 🚕 Таксі (їде справа наліво, зупиняється біля пасажира) -->
            <g class="taxi-group">
                <!-- Дим з-під коліс (пульсує під час руху) -->
                <circle class="smoke" cx="5" cy="176" r="3" style="animation-delay: 0s;" />
                <circle class="smoke" cx="2" cy="176" r="2.5" style="animation-delay: 0.2s;" />
                <circle class="smoke" cx="-1" cy="177" r="2" style="animation-delay: 0.4s;" />
                <circle class="smoke" cx="28" cy="176" r="3" style="animation-delay: 0.1s;" />
                <circle class="smoke" cx="25" cy="176" r="2.5" style="animation-delay: 0.3s;" />
                <circle class="smoke" cx="22" cy="177" r="2" style="animation-delay: 0.5s;" />
                
                <!-- Емодзі таксі -->
                <text x="0" y="175" font-size="35" filter="drop-shadow(0 0 8px rgba(255, 215, 0, 0.6))">🚕</text>
            </g>
        </svg>
        
        <!-- Надпис Urban з fade-in ефектом -->
        <div class="splash-title">Urban</div>
    </div>
    
    <div id="map"></div>
    
    <!-- Панель інформації про клієнта (зверху) -->
    <div class="driver-info-panel" id="driver-info-panel" style="
        position: fixed;
        top: 20px;
        left: 20px;
        right: 20px;
        background: rgba(26, 26, 26, 0.95);
        backdrop-filter: blur(10px);
        border: 2px solid #FFD700;
        border-radius: 16px;
        padding: 15px;
        z-index: 1000;
        color: #FFD700;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        display: none;
        transition: all 0.3s ease;
    ">
        <!-- Кнопка згортання -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div style="font-weight: bold; font-size: 18px;">📋 Інформація</div>
            <button id="toggle-info-btn" onclick="toggleInfoPanel()" style="
                background: rgba(255, 215, 0, 0.2);
                border: 1px solid #FFD700;
                border-radius: 50%;
                width: 32px;
                height: 32px;
                color: #FFD700;
                font-size: 18px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
            ">▼</button>
        </div>
        
        <!-- Контент який згортається -->
        <div id="info-content" style="transition: all 0.3s ease;">
            <div id="client-info" style="font-size: 16px; line-height: 1.6;"></div>
            <div id="route-distance" style="margin-top: 10px; font-size: 14px; color: #FFA500;"></div>
        </div>
    </div>
    
    <!-- Real-time статус водія ВИДАЛЕНО (швидкість та ETA не потрібні) -->
    
    <!-- Кнопка керування поїздкою (внизу) -->
    <button class="driver-control-btn" id="driver-action-btn" disabled>
        ⏳ Завантаження...
    </button>
    
    <div class="loading" id="loading">
        <div class="loading-text" id="loading-text">Urban</div>
        <div class="loading-wheel">
            <div class="wheel"></div>
            <div class="wheel-center"></div>
        </div>
    </div>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Отримати параметри з URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        const driverId = urlParams.get('driver_id');
        
        // Глобальні змінні
        let orderData = null;
        let driverLocation = null;
        let pickupMarker = null;
        let destinationMarker = null;
        let driverMarker = null;
        let routeLine = null;
        let watchId = null; // ID для watchPosition
        let lastRouteRebuild = 0; // Час останньої перебудови маршруту
        let currentSpeed = 0; // Поточна швидкість км/год
        let previousPosition = null; // Попередня позиція для розрахунку швидкості
        let routeDistance = 0; // Відстань маршруту в км
        
        // Ініціалізація карти
        const map = L.map('map').setView([50.4501, 30.5234], 13); // За замовчуванням Київ
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        // Завантажити дані замовлення після splash screen
        setTimeout(async () => {
            try {
                if (!orderId || !driverId) {
                    alert('❌ Помилка: відсутні параметри order_id або driver_id');
                    tg.close();
                    return;
                }
                
                // Показати loader
                const loading = document.getElementById('loading');
                loading.style.display = 'block';
                
                // Завантажити дані замовлення
                const response = await fetch(`/api/webapp/get-driver-order?order_id=${orderId}&driver_id=${driverId}`);
                const data = await response.json();
                
                if (!data.success) {
                    alert('❌ ' + (data.error || 'Помилка завантаження замовлення'));
                    loading.style.display = 'none';
                    tg.close();
                    return;
                }
                
                orderData = data.order;
                console.log('📦 Дані замовлення:', orderData);
                
                // Показати інформацію про клієнта
                showClientInfo(orderData);
                
                // Отримати позицію водія
                await getDriverLocation();
                
                // Побудувати маршрут
                await buildRouteForDriver();
                
                // Показати кнопку керування
                updateActionButton();
                
                loading.style.display = 'none';
                
            } catch (e) {
                console.error('❌ Помилка завантаження:', e);
                alert('❌ Помилка завантаження даних замовлення');
                document.getElementById('loading').style.display = 'none';
                tg.close();
            }
        }, 5000); // Після splash screen (4s анімація + 1s затримка)
        
        // Функція створення маркера
        function createMarker(type) {
            let emoji, html;
            
            switch(type) {
                case 'pickup':
                    emoji = '📍';
                    break;
                case 'destination':
                    emoji = '🏁';
                    break;
                case 'driver':
                    emoji = '🚕';
                    break;
                default:
                    emoji = '📍';
            }
            
            return L.divIcon({
                className: 'marker-icon',
                html: `<div style="font-size: 48px; line-height: 48px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));">${emoji}</div>`,
                iconSize: [48, 48],
                iconAnchor: [24, 46]
            });
        }
        
        // Показати інформацію про клієнта та замовлення
        function showClientInfo(order) {
            const infoPanel = document.getElementById('driver-info-panel');
            const clientInfo = document.getElementById('client-info');
            const routeDistance = document.getElementById('route-distance');
            
            // Форматувати телефон
            const phone = order.client_phone || 'Не вказано';
            
            // Інформація про клієнта
            clientInfo.innerHTML = `
                👤 <b>${order.client_name || 'Клієнт'}</b><br>
                📱 <a href="tel:${phone}">${phone}</a><br>
                📍 <b>Звідки:</b> ${order.pickup_address}<br>
                🎯 <b>Куди:</b> ${order.destination_address}
            `;
            
            // Інформація про маршрут
            const paymentEmoji = order.payment_method === 'cash' ? '💵' : '💳';
            routeDistance.innerHTML = `
                📏 <b>${order.distance_km} км</b><br>
                💰 <b>${Math.round(order.fare_amount)} грн</b> ${paymentEmoji}
            `;
            
            infoPanel.style.display = 'block';
        }
        
        // Згорнути/розгорнути інформаційну панель
        let isInfoCollapsed = false;
        function toggleInfoPanel() {
            const content = document.getElementById('info-content');
            const button = document.getElementById('toggle-info-btn');
            
            if (isInfoCollapsed) {
                // Розгорнути
                content.style.display = 'block';
                content.style.opacity = '1';
                content.style.maxHeight = '500px';
                button.textContent = '▼';
                isInfoCollapsed = false;
            } else {
                // Згорнути
                content.style.display = 'none';
                content.style.opacity = '0';
                content.style.maxHeight = '0';
                button.textContent = '▲';
                isInfoCollapsed = true;
            }
            
            // Вібрація
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }
        
        // Розрахувати відстань між двома точками (формула Haversine)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Радіус Землі в км
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Відстань в км
        }
        
        // Оновити маркер водія з плавною анімацією
        function updateDriverMarker(lat, lon) {
            if (!driverMarker) {
                // Створити новий маркер
                driverMarker = L.marker([lat, lon], {
                    icon: createMarker('driver')
                }).addTo(map);
            } else {
                // Плавно перемістити маркер
                const newLatLng = L.latLng(lat, lon);
                driverMarker.setLatLng(newLatLng);
            }
        }
        
        // Розрахувати ETA (очікуваний час прибуття)
        function calculateETA(distanceKm, speedKmh) {
            if (speedKmh < 1) return '--:--'; // Якщо стоїмо на місці
            
            const timeHours = distanceKm / speedKmh;
            const timeMinutes = Math.round(timeHours * 60);
            
            if (timeMinutes < 1) return '<1 хв';
            if (timeMinutes < 60) return `${timeMinutes} хв`;
            
            const hours = Math.floor(timeMinutes / 60);
            const minutes = timeMinutes % 60;
            return `${hours}г ${minutes}хв`;
        }
        
        // Оновити панель статусу (швидкість, ETA, точність)
        function updateDriverStatus(speed, accuracy) {
            const statusPanel = document.getElementById('driver-status-panel');
            const speedEl = document.getElementById('driver-speed');
            const etaEl = document.getElementById('driver-eta');
            const accuracyEl = document.getElementById('location-accuracy');
            
            // Оновити швидкість
            speedEl.textContent = `${Math.round(speed)} км/год`;
            
            // Розрахувати ETA до цільової точки
            let targetLat, targetLon;
            if (orderData.status === 'accepted') {
                targetLat = orderData.pickup_lat;
                targetLon = orderData.pickup_lon;
            } else if (orderData.status === 'in_progress') {
                targetLat = orderData.dest_lat;
                targetLon = orderData.dest_lon;
            }
            
            if (targetLat && targetLon && driverLocation) {
                const distanceToTarget = calculateDistance(
                    driverLocation.lat, driverLocation.lon,
                    targetLat, targetLon
                );
                const eta = calculateETA(distanceToTarget, speed);
                etaEl.textContent = eta;
            }
            
            // Оновити точність
            accuracyEl.textContent = `📡 Точність: ${Math.round(accuracy)} м`;
            
            // Показати панель
            statusPanel.style.display = 'block';
        }
        
        // Отримати початкову позицію водія та запустити real-time відстеження
        async function getDriverLocation() {
            return new Promise((resolve, reject) => {
                if ('geolocation' in navigator) {
                    // Спочатку отримати поточну позицію
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            driverLocation = {
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            };
                            console.log('📍 Початкова позиція водія:', driverLocation);
                            
                            // Запустити real-time відстеження
                            startRealTimeTracking();
                            
                            resolve(driverLocation);
                        },
                        (error) => {
                            console.error('❌ Помилка геолокації:', error);
                            // Fallback на pickup
                            driverLocation = {
                                lat: orderData.pickup_lat,
                                lon: orderData.pickup_lon
                            };
                            console.log('⚠️ Використовуємо pickup як позицію водія');
                            resolve(driverLocation);
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                } else {
                    // Геолокація не підтримується
                    driverLocation = {
                        lat: orderData.pickup_lat,
                        lon: orderData.pickup_lon
                    };
                    console.log('⚠️ Геолокація не підтримується, використовуємо pickup');
                    resolve(driverLocation);
                }
            });
        }
        
        // Запустити real-time відстеження позиції водія
        function startRealTimeTracking() {
            if (!('geolocation' in navigator)) {
                console.warn('⚠️ Геолокація не підтримується');
                return;
            }
            
            console.log('🎯 Запуск real-time відстеження...');
            
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const newLat = position.coords.latitude;
                    const newLon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const speed = position.coords.speed; // м/с або null
                    
                    console.log(`📍 Оновлення позиції: ${newLat}, ${newLon} (точність: ${Math.round(accuracy)}м)`);
                    
                    // Розрахувати швидкість якщо не надається GPS
                    if (previousPosition && speed === null) {
                        const distance = calculateDistance(
                            previousPosition.lat, previousPosition.lon,
                            newLat, newLon
                        );
                        const timeDiff = (Date.now() - previousPosition.timestamp) / 1000; // секунди
                        currentSpeed = (distance / timeDiff) * 3600; // км/год
                    } else if (speed !== null) {
                        currentSpeed = speed * 3.6; // конвертувати м/с в км/год
                    }
                    
                    // Оновити позицію водія
                    const oldLat = driverLocation.lat;
                    const oldLon = driverLocation.lon;
                    
                    driverLocation = { lat: newLat, lon: newLon };
                    previousPosition = { lat: newLat, lon: newLon, timestamp: Date.now() };
                    
                    // Оновити маркер на карті
                    updateDriverMarker(newLat, newLon);
                    
                    // Оновити панель статусу - ВИДАЛЕНО (панель не потрібна)
                    // updateDriverStatus(currentSpeed, accuracy);
                    
                    // Перевірити чи потрібно перебудувати маршрут
                    checkRouteDeviation(newLat, newLon, oldLat, oldLon);
                },
                (error) => {
                    console.error('❌ Помилка real-time відстеження:', error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 30000,
                    maximumAge: 0
                }
            );
        }
        
        // Перевірити відхилення від маршруту і перебудувати якщо потрібно
        async function checkRouteDeviation(newLat, newLon, oldLat, oldLon) {
            // Не перебудовувати якщо немає статусу accepted
            if (orderData.status !== 'accepted') {
                return;
            }
            
            // Розрахувати відстань від попередньої точки
            const movedDistance = calculateDistance(oldLat, oldLon, newLat, newLon) * 1000; // в метрах
            
            // Перебудувати тільки якщо рухаємось (>20м) і минуло >10 секунд з останньої перебудови
            const now = Date.now();
            const timeSinceRebuild = (now - lastRouteRebuild) / 1000; // секунди
            
            if (movedDistance > 20 && timeSinceRebuild > 10) {
                console.log(`🔄 Відхилення: ${Math.round(movedDistance)}м, перебудовуємо маршрут...`);
                lastRouteRebuild = now;
                await buildRouteForDriver();
            }
        }
        
        // Зупинити real-time відстеження (при закритті вебаппа)
        function stopRealTimeTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                console.log('⏹️ Real-time відстеження зупинено');
            }
        }
        
        // Побудувати маршрут залежно від статусу замовлення
        async function buildRouteForDriver() {
            if (!orderData || !driverLocation) {
                console.error('❌ Відсутні дані для побудови маршруту');
                return;
            }
            
            let fromLat, fromLon, toLat, toLon;
            
            // Визначити точки маршруту залежно від статусу
            if (orderData.status === 'accepted') {
                // Водій їде до клієнта (від водія до pickup)
                fromLat = driverLocation.lat;
                fromLon = driverLocation.lon;
                toLat = orderData.pickup_lat;
                toLon = orderData.pickup_lon;
                
                // Додати маркери
                driverMarker = L.marker([fromLat, fromLon], {
                    icon: createMarker('driver')
                }).addTo(map);
                
                pickupMarker = L.marker([toLat, toLon], {
                    icon: createMarker('pickup')
                }).addTo(map);
                
            } else if (orderData.status === 'in_progress') {
                // Клієнт в авто, їдуть до пункту призначення (від pickup до destination)
                fromLat = orderData.pickup_lat;
                fromLon = orderData.pickup_lon;
                toLat = orderData.dest_lat;
                toLon = orderData.dest_lon;
                
                // Додати маркери
                pickupMarker = L.marker([fromLat, fromLon], {
                    icon: createMarker('pickup')
                }).addTo(map);
                
                destinationMarker = L.marker([toLat, toLon], {
                    icon: createMarker('destination')
                }).addTo(map);
                
            } else {
                // Інші статуси - показати обидві точки
                fromLat = orderData.pickup_lat;
                fromLon = orderData.pickup_lon;
                toLat = orderData.dest_lat;
                toLon = orderData.dest_lon;
                
                pickupMarker = L.marker([fromLat, fromLon], {
                    icon: createMarker('pickup')
                }).addTo(map);
                
                destinationMarker = L.marker([toLat, toLon], {
                    icon: createMarker('destination')
                }).addTo(map);
            }
            
            // Побудувати маршрут через OSRM
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                    
                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }
                    
                    routeLine = L.polyline(coords, {
                        color: '#2196F3',
                        weight: 6,
                        opacity: 0.9,
                        className: 'animated-route'
                    }).addTo(map);
                    
                    // Анімація поступового прокладання маршруту
                    setTimeout(() => {
                        const pathElement = routeLine.getElement();
                        if (pathElement) {
                            const length = pathElement.getTotalLength();
                            pathElement.style.strokeDasharray = length;
                            pathElement.style.strokeDashoffset = length;
                            pathElement.style.animation = `drawRoute 2s ease-in-out forwards`;
                            
                            // Видалити анімацію після завершення щоб лінія залишалась суцільною
                            setTimeout(() => {
                                pathElement.style.strokeDasharray = 'none';
                                pathElement.style.strokeDashoffset = '0';
                                pathElement.style.animation = 'none';
                            }, 2100); // 2s анімація + 100ms запас
                        }
                    }, 100);
                    
                    // Центрувати карту на маршруті
                    map.fitBounds(routeLine.getBounds(), { padding: [80, 80] });
                    
                    console.log('✅ Маршрут побудовано');
                } else {
                    console.error('❌ Не вдалося побудувати маршрут:', data);
                }
            } catch (e) {
                console.error('❌ Помилка побудови маршруту:', e);
            }
        }
        
        // Оновити текст кнопки керування залежно від статусу
        function updateActionButton() {
            const button = document.getElementById('driver-action-btn');
            
            if (!orderData) {
                button.textContent = '⏳ Завантаження...';
                button.disabled = true;
                return;
            }
            
            button.disabled = false;
            
            switch(orderData.status) {
                case 'accepted':
                    button.textContent = '📍 Я на місці';
                    button.onclick = () => handleDriverAction('arrived');
                    break;
                case 'in_progress':
                    button.textContent = '✅ Завершити поїздку';
                    button.onclick = () => handleDriverAction('complete');
                    break;
                case 'completed':
                    button.textContent = '✔️ Поїздка завершена';
                    button.disabled = true;
                    break;
                default:
                    button.textContent = '⏳ Очікування...';
                    button.disabled = true;
            }
        }
        
        // Обробник дій водія
        async function handleDriverAction(action) {
            console.log('🚗 Дія водія:', action);
            
            // Показати loader
            const loading = document.getElementById('loading');
            const button = document.getElementById('driver-action-btn');
            
            button.disabled = true;
            loading.style.display = 'block';
            
            try {
                // Відправити запит на сервер
                const response = await fetch('/api/webapp/driver-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: parseInt(orderId),
                        driver_id: parseInt(driverId),
                        action: action
                    })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    alert('❌ ' + (data.error || 'Помилка виконання дії'));
                    button.disabled = false;
                    loading.style.display = 'none';
                    return;
                }
                
                console.log('✅ Дія виконана:', data);
                
                // Оновити дані замовлення
                orderData.status = data.new_status;
                
                // Вібрація для зворотного зв'язку
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                
                // Обробка різних дій
                if (action === 'complete') {
                    // Завершено - закрити вебапп через 2 секунди
                    stopRealTimeTracking(); // Зупинити відстеження
                    setTimeout(() => {
                        tg.close();
                    }, 2000);
                } else if (action === 'arrived') {
                    // Після "Я на місці" НЕ викликати updateActionButton бо статус не змінився
                    // Вручну змінити кнопку на "Клієнт в авто"
                    button.textContent = '🚗 Клієнт в авто';
                    button.onclick = () => handleDriverAction('start');
                    button.disabled = false;
                    console.log('✅ Кнопка змінена на "Клієнт в авто"');
                } else if (action === 'start') {
                    // Після "Клієнт в авто" - ПЕРЕБУДУВАТИ маршрут до destination
                    console.log('🔄 Перебудова маршруту після "Клієнт в авто"...');
                    
                    // Видалити старий маршрут та маркери
                    if (routeLine) {
                        map.removeLayer(routeLine);
                        routeLine = null;
                    }
                    if (pickupMarker) {
                        map.removeLayer(pickupMarker);
                        pickupMarker = null;
                    }
                    if (driverMarker) {
                        map.removeLayer(driverMarker);
                        driverMarker = null;
                    }
                    
                    // Перебудувати маршрут (зараз від pickup до destination)
                    await buildRouteForDriver();
                    
                    // Оновити кнопку
                    updateActionButton();
                }
                
                loading.style.display = 'none';
                
            } catch (e) {
                console.error('❌ Помилка виконання дії:', e);
                alert('❌ Помилка виконання дії: ' + e.message);
                button.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        // Функція побудови маршруту
        async function buildRoute(fromLat, fromLon, toLat, toLon) {
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loading-text');
            loadingText.textContent = 'Urban';
            loading.style.display = 'block';
            
            // Почекати поки анімація "Urban" завершиться (1.5s typing + 0.3s запас)
            await new Promise(resolve => setTimeout(resolve, 1800));
            
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                    
                    if (routeLine) {
                        map.removeLayer(routeLine);
                    }
                    
                    routeLine = L.polyline(coords, {
                        color: '#2196F3',
                        weight: 6,
                        opacity: 0.9,
                        className: 'animated-route'
                    }).addTo(map);
                    
                    // Анімація поступового прокладання маршруту
                    setTimeout(() => {
                        const pathElement = routeLine.getElement();
                        if (pathElement) {
                            const length = pathElement.getTotalLength();
                            pathElement.style.strokeDasharray = length;
                            pathElement.style.strokeDashoffset = length;
                            pathElement.style.animation = `drawRoute 2s ease-in-out forwards`;
                        }
                    }, 100);
                    
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                    
                    // Показати інформацію про маршрут
                    const distance = (route.distance / 1000).toFixed(1);
                    const duration = Math.round(route.duration / 60);
                    
                    // Спробувати отримати ціну
                    try {
                        const userId = tg.initDataUnsafe?.user?.id;
                        if (userId) {
                            const priceResponse = await fetch('/api/webapp/calculate-price', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    user_id: userId,
                                    distance_km: parseFloat(distance),
                                    duration_minutes: duration
                                })
                            });
                            
                            if (priceResponse.ok) {
                                const priceData = await priceResponse.json();
                                if (priceData.success) {
                                    updateRouteInfo(distance, duration, priceData.price);
                                } else {
                                    updateRouteInfo(distance, duration);
                                }
                            } else {
                                updateRouteInfo(distance, duration);
                            }
                        } else {
                            updateRouteInfo(distance, duration);
                        }
                    } catch (priceError) {
                        console.error('Помилка розрахунку ціни:', priceError);
                        updateRouteInfo(distance, duration);
                    }
                }
            } catch (e) {
                alert('Помилка побудови маршруту');
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // Функція оновлення інформації про маршрут
        function updateRouteInfo(distance, duration, price = null) {
            const routeInfo = document.getElementById('route-info');
            if (routeInfo) {
                let html = `
                    <strong>📏 Маршрут:</strong><br>
                    Відстань: ${distance} км<br>
                    Час: ~${duration} хв
                `;
                
                if (price !== null) {
                    // Округлити до цілого числа (як у кнопках при створенні замовлення)
                    const roundedPrice = Math.round(price);
                    html += `<br><strong>💰 Ціна: ${roundedPrice} грн</strong>`;
                }
                
                routeInfo.innerHTML = html;
                routeInfo.style.display = 'block';
            }
        }
        
        // Оновлення панелі адрес
        let lastNominatimCall = 0;
        async function updateAddressPanel(type, lat, lng) {
            try {
                // Rate limiting для Nominatim (1 запит в секунду)
                const now = Date.now();
                const timeSinceLastCall = now - lastNominatimCall;
                if (timeSinceLastCall < 1000) {
                    await new Promise(resolve => setTimeout(resolve, 1000 - timeSinceLastCall));
                }
                lastNominatimCall = Date.now();
                
                // Використовуємо Nominatim для reverse geocoding
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
                    {
                        headers: {
                            'User-Agent': 'TaxiBot WebApp/1.0'
                        }
                    }
                );
                const data = await response.json();
                
                let address = 'Завантаження...';
                if (data && data.display_name) {
                    // Коротка адреса: вулиця + будинок
                    const parts = data.display_name.split(',');
                    address = parts.slice(0, 2).join(',').trim();
                }
                
                if (type === 'pickup') {
                    document.getElementById('pickup-address-text').textContent = address;
                    document.getElementById('selected-addresses').style.display = 'block';
                } else if (type === 'destination') {
                    document.getElementById('dest-address-text').textContent = address;
                    document.getElementById('dest-address-line').style.display = 'flex';
                }
            } catch (e) {
                console.error('Помилка отримання адреси:', e);
                // Fallback на координати
                const fallbackAddress = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                if (type === 'pickup') {
                    document.getElementById('pickup-address-text').textContent = fallbackAddress;
                } else {
                    document.getElementById('dest-address-text').textContent = fallbackAddress;
                }
            }
        }
        
        // Кнопка підтвердження
        document.getElementById('confirm').addEventListener('click', async () => {
            const center = map.getCenter();
            
            if (currentState === 'pickup') {
                // Зберігаємо pickup
                pickupCoords = { lat: center.lat, lng: center.lng };
                
                if (pickupMarker) {
                    map.removeLayer(pickupMarker);
                }
                
                pickupMarker = L.marker([center.lat, center.lng], {
                    icon: createMarker(true)
                }).addTo(map);
                
                // Оновити панель
                updateAddressPanel('pickup', center.lat, center.lng);
                
                // Переходимо до destination
                currentState = 'destination';
                document.getElementById('center-marker').textContent = '🏁';
                document.getElementById('search').placeholder = '🎯 Куди їдемо?';
                document.getElementById('search').value = '';  // Очистити поле вводу
                autocompleteResults.style.display = 'none';  // Сховати підказки
                autocompleteResults.innerHTML = '';  // Очистити підказки
                
            } else if (currentState === 'destination') {
                // Зберігаємо destination
                destinationCoords = { lat: center.lat, lng: center.lng };
                
                if (destinationMarker) {
                    map.removeLayer(destinationMarker);
                }
                
                destinationMarker = L.marker([center.lat, center.lng], {
                    icon: createMarker(false)
                }).addTo(map);
                
                // Оновити панель
                updateAddressPanel('destination', center.lat, center.lng);
                
                // Будуємо маршрут
                await buildRoute(
                    pickupCoords.lat, pickupCoords.lng,
                    destinationCoords.lat, destinationCoords.lng
                );
                
                // Переходимо до confirm
                currentState = 'confirm';
                document.getElementById('center-marker').style.display = 'none';
                document.getElementById('search').placeholder = '✅ Підтвердити замовлення';
                document.getElementById('search').value = '';  // Очистити поле вводу
                autocompleteResults.style.display = 'none';  // Сховати підказки
                autocompleteResults.innerHTML = '';  // Очистити підказки
                
            } else if (currentState === 'confirm') {
                // Відправляємо дані
                const userId = tg.initDataUnsafe?.user?.id;
                
                if (!userId) {
                    alert('Помилка: не вдалося отримати ID користувача');
                    return;
                }
                
                try {
                    const response = await fetch('/api/webapp/order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: userId,
                            pickup_lat: pickupCoords.lat,
                            pickup_lon: pickupCoords.lng,
                            dest_lat: destinationCoords.lat,
                            dest_lon: destinationCoords.lng
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                        setTimeout(() => tg.close(), 500);
                    } else {
                        alert('Помилка: ' + result.error);
                    }
                } catch (e) {
                    alert('Помилка відправки: ' + e.message);
                }
            }
        });
        
        // Анімація при перетягуванні карти
        let isDragging = false;
        map.on('movestart', () => {
            isDragging = true;
            document.getElementById('center-marker').classList.add('dragging');
        });
        
        map.on('moveend', () => {
            isDragging = false;
            document.getElementById('center-marker').classList.remove('dragging');
        });
        
        // Функція форматування адреси для підказки
        function formatAddressShort(item) {
            const address = item.address || {};
            const parts = [];
            
            // Вулиця + номер будинку
            if (address.road) {
                let street = address.road;
                if (address.house_number) {
                    street += ', ' + address.house_number;
                }
                parts.push(street);
            }
            
            // Район/мікрорайон
            if (address.suburb) {
                parts.push(address.suburb);
            } else if (address.neighbourhood) {
                parts.push(address.neighbourhood);
            } else if (address.quarter) {
                parts.push(address.quarter);
            }
            
            // Якщо немає вулиці, додати основну інформацію
            if (parts.length === 0) {
                if (address.amenity || address.building || address.shop) {
                    parts.push(address.amenity || address.building || address.shop);
                }
            }
            
            return parts.length > 0 ? parts.join(', ') : item.display_name.split(',')[0];
        }
        
        // Функція фільтрації результатів по місту
        function filterByUserCity(results) {
            if (!userCity) return results;
            
            const cityLower = userCity.toLowerCase();
            return results.filter(item => {
                const address = item.address || {};
                const displayName = (item.display_name || '').toLowerCase();
                
                // Перевірити чи адреса з міста клієнта
                const isFromUserCity = 
                    displayName.includes(cityLower) ||
                    (address.city && address.city.toLowerCase() === cityLower) ||
                    (address.town && address.town.toLowerCase() === cityLower) ||
                    (address.municipality && address.municipality.toLowerCase() === cityLower);
                
                return isFromUserCity;
            });
        }
        
        // Пошук адрес
        const searchInput = document.getElementById('search');
        const autocompleteResults = document.getElementById('autocomplete-results');
        let searchTimeout;
        
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 3) {
                autocompleteResults.style.display = 'none';
                autocompleteResults.innerHTML = '';
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                try {
                    // Додати user_id для server-side фільтрації
                    const userId = tg.initDataUnsafe?.user?.id;
                    let url = `/api/webapp/geocode?q=${encodeURIComponent(query)}`;
                    if (userId) {
                        url += `&user_id=${userId}`;
                    }
                    
                    const response = await fetch(url);
                    let data = await response.json();
                    
                    // Фільтрувати результати по місту клієнта (client-side)
                    if (userCity) {
                        data = filterByUserCity(data);
                        console.log(`🔍 Фільтрація: з ${data.length} результатів залишилось для міста ${userCity}`);
                    }
                    
                    if (data.length === 0) {
                        autocompleteResults.innerHTML = '<div class="autocomplete-item">🔍 Нічого не знайдено в вашому місті</div>';
                        autocompleteResults.style.display = 'block';
                        return;
                    }
                    
                    autocompleteResults.innerHTML = '';
                    data.slice(0, 5).forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        
                        // Коротка адреса: вулиця, номер, район
                        const shortAddress = formatAddressShort(item);
                        div.textContent = shortAddress;
                        
                        div.addEventListener('click', () => {
                            map.setView([item.lat, item.lon], 16);
                            searchInput.value = shortAddress;
                            autocompleteResults.style.display = 'none';
                        });
                        autocompleteResults.appendChild(div);
                    });
                    
                    autocompleteResults.style.display = 'block';
                } catch (e) {
                    console.error('Помилка пошуку:', e);
                }
            }, 500);
        });
        
        // Закрити autocomplete при кліку поза ним
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !autocompleteResults.contains(e.target)) {
                autocompleteResults.style.display = 'none';
                autocompleteResults.innerHTML = '';  // Також очистити вміст
            }
        });
        
        // Кнопка геолокації
        document.getElementById('location-btn').addEventListener('click', () => {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        map.setView([lat, lon], 16);
                        loading.style.display = 'none';
                        
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                    },
                    (error) => {
                        loading.style.display = 'none';
                        alert('❌ Не вдалося отримати геолокацію');
                        console.error('Geolocation error:', error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                loading.style.display = 'none';
                alert('❌ Геолокація не підтримується');
            }
        });
        
        // Кнопки редагування адрес
        document.getElementById('edit-pickup-btn').addEventListener('click', () => {
            // Повернутися до вибору pickup
            currentState = 'pickup';
            document.getElementById('center-marker').style.display = 'block';
            document.getElementById('center-marker').textContent = '📍';
            document.getElementById('search').placeholder = '📍 Звідки їдемо?';
            
            // Видалити маркер pickup
            if (pickupMarker) {
                map.removeLayer(pickupMarker);
                pickupMarker = null;
            }
            
            // Якщо є destination - видалити і його
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
            
            // Видалити маршрут
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            
            // Сховати панель з відстанню і ціною
            const routeInfo = document.getElementById('route-info');
            if (routeInfo) {
                routeInfo.style.display = 'none';
            }
            
            // Сховати destination line
            document.getElementById('dest-address-line').style.display = 'none';
            document.getElementById('pickup-address-text').textContent = 'Не обрано';
            
            // Центрувати на pickup координатах якщо були
            if (pickupCoords) {
                map.setView([pickupCoords.lat, pickupCoords.lng], 15);
            }
            
            pickupCoords = null;
            destinationCoords = null;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
        
        document.getElementById('edit-dest-btn').addEventListener('click', () => {
            // Повернутися до вибору destination
            currentState = 'destination';
            document.getElementById('center-marker').style.display = 'block';
            document.getElementById('center-marker').textContent = '🏁';
            document.getElementById('search').placeholder = '🎯 Куди їдемо?';
            
            // Видалити маркер destination
            if (destinationMarker) {
                map.removeLayer(destinationMarker);
                destinationMarker = null;
            }
            
            // Видалити маршрут
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            
            // Сховати панель з відстанню і ціною
            const routeInfo = document.getElementById('route-info');
            if (routeInfo) {
                routeInfo.style.display = 'none';
            }
            
            // Оновити текст
            document.getElementById('dest-address-text').textContent = 'Не обрано';
            
            // Центрувати на destination координатах якщо були
            if (destinationCoords) {
                map.setView([destinationCoords.lat, destinationCoords.lng], 15);
            }
            
            destinationCoords = null;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
        
        // Кнопка пошуку в полі вводу
        document.getElementById('search-btn').addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query.length >= 3) {
                // Тригерити пошук
                searchInput.dispatchEvent(new Event('input'));
            }
        });
        
        // Закриття WebApp
        tg.BackButton.show();
        tg.onEvent('backButtonClicked', () => {
            stopRealTimeTracking(); // Зупинити відстеження перед закриттям
            tg.close();
        });
        
        // Також зупинити при закритті браузера/вкладки
        window.addEventListener('beforeunload', () => {
            stopRealTimeTracking();
        });
    </script>
</body>
</html>
