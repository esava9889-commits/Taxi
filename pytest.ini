[pytest]
# Конфігурація pytest

# Де шукати тести
testpaths = tests

# Патерн файлів з тестами
python_files = test_*.py

# Патерн класів з тестами
python_classes = Test*

# Патерн функцій з тестами
python_functions = test_*

# Опції за замовчуванням
addopts = 
    # Показувати докладний вивід
    -v
    # Показувати summary в кінці
    -ra
    # Показувати локальні змінні при помилках
    --showlocals
    # Колір в терміналі
    --color=yes
    # Покриття коду
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    # Не показувати warnings (опціонально)
    # --disable-warnings

# Мінімальна версія pytest
minversion = 7.0

# Markers (для фільтрації тестів)
markers =
    slow: позначає повільні тести (skip за замовчуванням)
    integration: інтеграційні тести (потребують БД)
    unit: юніт-тести (швидкі, ізольовані)
    db: тести що потребують БД

# Asyncio mode
asyncio_mode = auto

# Фільтрувати warnings
filterwarnings =
    # Ігнорувати deprecation warnings з бібліотек
    ignore::DeprecationWarning
    # Показувати наші warnings
    default::UserWarning
